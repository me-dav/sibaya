server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Audio soal maksimal 10 MB
    client_max_body_size 12m;

    # IP asli pengunjung saat ada reverse proxy di host (Docker bridge 172.16.0.0/12)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Aset Vite (nama file ber-hash, aman di-cache lama)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disk "public" Laravel (gambar materi). Hanya storage/app/public yang dilayani.
    # Audio soal ada di storage/app/private dan TIDAK terjangkau dari sini.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }

    # Tidak ada file PHP lain yang boleh dieksekusi
    location ~ \.php$ { return 404; }

    # Sembunyikan dotfile (.env, .git), kecuali .well-known untuk sertifikat TLS
    location ~ /\.(?!well-known) { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
