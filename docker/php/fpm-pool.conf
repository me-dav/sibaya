[www]
; Cocok untuk VPS 2 GB. Naikkan max_children jika RAM lebih besar.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Teruskan variabel environment container ke PHP
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
