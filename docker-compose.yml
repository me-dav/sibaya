name: sibaya

services:
  app:
    build:
      context: .
      target: production
    image: sibaya-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Nilai di bawah menimpa isi .env
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      target: web
    image: sibaya-web:latest
    restart: unless-stopped
    ports:
      # Default: hanya bisa diakses dari server itu sendiri (untuk reverse proxy/TLS di host).
      # Untuk membuka langsung ke internet: WEB_BIND=0.0.0.0 dan WEB_PORT=80
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on: [app]
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sengaja TANPA "ports": database tidak dibuka ke luar Docker
    networks: [internal]

  # Opsional: aktifkan jika nanti memakai antrean (queue) atau email terjadwal
  # worker:
  #   image: sibaya-app:latest
  #   restart: unless-stopped
  #   env_file: .env
  #   environment: { APP_ENV: production, DB_HOST: db }
  #   command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
  #   volumes: [storage_data:/var/www/html/storage]
  #   depends_on: [app]
  #   networks: [internal]

volumes:
  pgdata:
  storage_data:

networks:
  internal:
